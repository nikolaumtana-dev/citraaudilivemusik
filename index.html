<style>

.lr{display:flex;justify-content:space-between;color:var(--dm);font-size:10px}.lr .pv{color:var(--tx)}

.mt.on{background:#f0536a;border-color:#f0536a;color:#fff}.so.on{background:#f0b13a;border-color:#f0b13a;color:#1a1100}

.st{background:#102c52;border-color:#0a1c33}

.thm::after{left:3px;right:3px;top:calc(50% - 1px);height:2px;background:#222}
.zl{background:#6fa8e855}

:root{--fh:clamp(250px,calc(100vh - 500px),560px)}
.fw{--pt:24px;--pb:24px}

.st>*{flex-shrink:0}.st>.fxl{flex:1 0 auto}.fw{flex:0 0 var(--fh)}
</style>

<body>
<div class="top">
 <button id="menu" aria-label="Menu">☰</button>
 <span class="logo">Ar<i>Son</i>Mix</span>
 <span class="m">Session: <input id="ses" value="Live Vocal Studio"></span>
 <span class="badge">WEB AUDIO</span>
 <span class="m"><b id="sr">48</b> kHz</span><span class="m"><b id="lt">480</b> samples</span>
 <span class="m">Snapshot: <b id="cs">Vocal Live</b></span>
 <button id="vm">Volume: Fader</button>
 <button id="rec">● Rekam</button>

</div>
<div class="body">
 <div class="side" id="side"></div>
 <div class="main"><div id="mix"></div><div id="pg" hidden></div></div>
</div>
<div class="ft"><span id="stt">Stopped · klik di mana saja untuk mengaktifkan audio</span><span><b>Catatan:</b> VST3 asli tidak bisa dimuat di browser; FX bawaan dipakai sebagai gantinya</span></div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<input type="file" id="fin" accept="audio/*" hidden>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];

const FXD={
 eq:{n:'Parametric EQ',c:'EQ',d:'EQ 3 band: low, mid, high',p:[['lo','Low dB',-15,15,.5,0],['mi','Mid dB',-15,15,.5,0],['mf','Mid Hz',200,5000,10,1000],['hi','High dB',-15,15,.5,0]]},
 comp:{n:'Compressor',c:'DYNAMICS',d:'Kompresor dinamika dengan makeup gain',p:[['th','Threshold dB',-60,0,1,-20],['ra','Ratio',1,20,.5,3],['mk','Makeup dB',0,18,.5,2]]},
 gate:{n:'Gate',c:'DYNAMICS',d:'Meredam noise saat tidak ada suara',p:[['th','Threshold dB',-80,-10,1,-50],['rg','Range dB',-80,-6,1,-40]]},
 deess:{n:'De-Esser',c:'DYNAMICS',d:'Menekan desis huruf S pada vokal',p:[['fr','Frekuensi Hz',3000,10000,100,6000],['th','Threshold dB',-50,0,1,-30],['ra','Ratio',1,20,.5,6]]},
 lim:{n:'Brickwall Limiter',c:'DYNAMICS',d:'Pembatas level agar tidak clipping',p:[['ce','Ceiling dB',-20,0,.5,-1]]},
 rev:{n:'Reverb',c:'REVERB',d:'Ruang reverb sintetis',p:[['mx','Mix',0,1,.01,.25],['dc','Decay s',.3,4,.1,1.8]]},
 dly:{n:'Delay',c:'DELAY',d:'Echo dengan feedback',p:[['t','Time ms',40,1000,10,300],['fb','Feedback',0,.85,.01,.3],['mx','Mix',0,1,.01,.25]]}};

const mkc=i=>({k:'c',i,id:'c'+i,name:NM[i],v:UN,pan:0,mute:false,solo:false,ph:false,tr:0,eq:[0,0,0],hpf:i<2||i==4,mode:[2,3,9].includes(i)?'s':'m',src:'',fx:[],h:[0,0]});

const getO=id=>id==='m'?M:chs[+id.slice(1)];
const DEF=[['eq','comp','deess'],['eq','comp'],['eq','comp'],['eq','comp'],['gate','eq','comp'],['eq','lim'],['eq','rev'],['comp','dly'],['eq','rev'],['rev']];
const PRE={'Clean Vocal':['eq','comp','deess'],'Warm Karaoke':['eq','comp','rev'],'Live Broadcast':['gate','eq','comp','lim']};
let ctx,mst,recDest,kan,recorder,tab='mix',sel=0,side='ch',curSnap='Vocal Live',cat='ALL',dOut=[],dIn=[],fileT=null,lsum=0,ln=0,tp=-99,dlgO=null,dlgK=0,lastPre='';
const pads=[...Array(8)].map(()=>({n:'',a:null}));
const TABS=[['mix','MIX'],['rack','FX RACK'],['flow','SIGNAL FLOW'],['snd','MY SOUNDS'],['plg','PLUGINS'],['set','SETUP'],['chk','SIGNAL CHECK']];
/* ---------- strip ---------- */
function build(o){const m=o.k==='m',c=m?'#a85d7d':COL[o.i],e=document.createElement('div');e.className='st'+(m?' mst':'');e.dataset.o=o.id;
 const sc=[10,0,-10,-20,-30,-40,-50,-60];
 e.innerHTML=`<div class="sh" style="background:${c}" data-a="sel">${m?'MASTER':o.i+1}</div><div class="fxl"></div>
 ${m?'<div class="lv"><span class="lvl">LUFS-I —</span><span class="tpk">dBTP —</span></div>':'<div class="kg">'+kn('tr','GAIN',-18,18,0)+kn('hi','HI',-15,15,0)+kn('mi','MID',-15,15,0)+kn('lo','LO',-15,15,0)+'</div><div class="kg1">'+kn('pan','PAN',-100,100,0)+'</div><div class="r2"><button data-a="ph">Ø</button><button data-a="hp">HPF</button></div>'}
 <div class="r2"><button class="mt" data-a="mt">MUTE</button>${m?'<button class="on" style="cursor:default">STEREO</button>':'<button class="so" data-a="so">SOLO</button>'}</div>
 <div class="db">0.0 dB</div>
 <div class="leds"><i class="sg" title="Sinyal"></i><i class="pk" title="Peak"></i></div>

 <div class="bt" style="background:${c}" data-a="ren"><span class="nm">${m?'MASTER':o.name}</span><span>${m?'':IC[o.i]}</span></div>`;
 o.el=e;$('#mix').appendChild(e)}
function renderFx(o){const l=$('.fxl',o.el);let h='';for(let k=0;k<5;k++){const f=o.fx[k];
  h+=f?`<div class="sl ${f.on?'':'off'}"><span class="fn" data-a="op" data-k="${k}" title="${FXD[f.t].n}">${FXD[f.t].n}</span><button class="pw ${f.on?'on':''}" data-a="pw" data-k="${k}">⏻</button></div>`:`<button class="ad" data-a="add">+ ADD FX</button>`}
 l.innerHTML=h}
function sync(o){const e=o.el,ch=o.k==='c';setFd(e,o.v);setKn(e,'vol',o.v);$('.db',e).textContent=fmt(o.v);$('.mt',e).classList.toggle('on',o.mute);e.classList.toggle('sel',sel===(ch?o.i:-1)&&tab!=='x');
 if(ch){$('.so',e).classList.toggle('on',o.solo);$$('[data-a=ph]',e)[0].classList.toggle('on',o.ph);$$('[data-a=hp]',e)[0].classList.toggle('on',o.hpf);setKn(e,'tr',o.tr);setKn(e,'hi',o.eq[2]);setKn(e,'mi',o.eq[1]);setKn(e,'lo',o.eq[0]);setKn(e,'pan',Math.round(o.pan*100));$('.nm',e).textContent=o.name}}
/* ---------- audio ---------- */

function ensure(){if(ctx){ctx.state!=='running'&&ctx.resume();return}

 else if(a==='snv'){const n=prompt('Nama snapshot:','Snapshot '+(Object.keys(snaps).length+1));if(!n)return;snaps[n]=getS();curSnap=n;$('#cs').textContent=n;try{localStorage.setItem('arsonmix.v3',JSON.stringify(snaps))}catch(x){}return renderSide()}
 else if(a==='pad'){const p=pads[+t.dataset.i];if(!p.a){fileT=p;return $('#fin').click()}if(p.a.paused){p.a.currentTime=0;p.a.play()}else p.a.pause();return setTimeout(renderTab,50)}
 else if(a==='padx'){pads.forEach(p=>p.a&&p.a.pause());return renderTab()}
 else if(a==='tone'){const g=ctx.createGain(),os=ctx.createOscillator();os.frequency.value=440;g.gain.value=.4;os.connect(g);g.connect(o.inp);o.tone=1;os.start();setTimeout(()=>{os.stop();g.disconnect()},1500);return}
 else if(a==='perm'){navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(x=>x.stop());devs()}).catch(x=>{$('#stt').textContent='Izin mikrofon ditolak: '+x.name});return}
 else if(a==='ex'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(getS(),null,1)],{type:'application/json'}));l.download='arsonmix-snapshot.json';l.click();return}
 else if(a==='rst'){if(confirm('Reset semua ke pengaturan awal?'))setS(S0());return}
 else return;
 sync(o);apply();if(tab!=='mix')renderTab();renderSide()});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;if(t.id==='sq')return dlgAdd();if(!a)return;const id=t.dataset.o||t.closest('[data-o]').dataset.o,o=getO(id);
 if(a==='fd'){o.v=+t.value;$('.db',o.el).textContent=fmt(o.v);setKn(o.el,'vol',o.v)}
 else if(a==='pan'){o.pan=t.value/100;sync(o)}
 else if(a==='pr'){const f=o.fx[+t.dataset.k];f.p[t.dataset.key]=+t.value;t.previousElementSibling&&(t.previousElementSibling.textContent=(+t.value).toFixed(+t.step<1?2:0));applyFx(f)}
 apply()});
document.addEventListener('dblclick',e=>{const t=e.target;if(t.dataset.a==='fd'){const o=getO(t.closest('[data-o]').dataset.o);o.v=UN;sync(o);apply()}if(t.dataset.a==='pan'){const o=getO(t.closest('[data-o]').dataset.o);o.pan=0;sync(o);apply()}});

 if(a==='src')await setSrc(o,t.value);if(a==='md'){o.mode=t.value;o.inp.channelCount=t.value==='m'?1:2}
 if(a==='out'){try{await ctx.setSinkId(t.value||'')}catch(x){$('#stt').textContent='Browser tidak mendukung ganti output'}}});

/* ---------- knob ---------- */
function kdisp(key,v){if(key==='pan'){v=Math.round(v);return v==0?'C':(v<0?'L'+-v:'R'+v)}if(key==='vol')return fmt(v);return (v>0?'+':'')+v.toFixed(key==='tr'?1:0)}
function kn(key,lb,mn,mx,def,cls=''){const z=cls.includes('big')?64:36;return `<div class="kb${cls}" data-a="kn" data-key="${key}" data-min="${mn}" data-max="${mx}" data-def="${def}" data-v="${def}"><svg viewBox="0 0 40 40" width="${z}" height="${z}"><circle cx="20" cy="20" r="17" fill="#22343f" stroke="#4d6d7f" stroke-width="1.5"/><circle cx="20" cy="20" r="11" fill="#18262f"/><line class="ind" x1="20" y1="20" x2="20" y2="7" stroke="#e8f4fa" stroke-width="2.4" stroke-linecap="round" transform="rotate(${-135+(def-mn)/(mx-mn)*270} 20 20)"/></svg><span class="kl">${lb}</span><b class="kv">${kdisp(key,def)}</b></div>`}
function paint(k,v){const mn=+k.dataset.min,mx=+k.dataset.max;k.dataset.v=v;$('.ind',k).setAttribute('transform','rotate('+(-135+(v-mn)/(mx-mn)*270)+' 20 20)');$('.kv',k).textContent=kdisp(k.dataset.key,v)}
function setKn(e,key,v){const k=$('.kb[data-key="'+key+'"]',e);if(k)paint(k,v)}
function knSet(k,v,u){const key=k.dataset.key;v=key==='vol'?Math.round(v*10)/10:key==='pan'?Math.round(v):Math.round(v*2)/2;paint(k,v);if(!u)return;const o=getO(k.closest('[data-o]').dataset.o);
 if(key==='tr')o.tr=v;else if(key==='hi')o.eq[2]=v;else if(key==='mi')o.eq[1]=v;else if(key==='lo')o.eq[0]=v;else if(key==='pan')o.pan=v/100;else if(key==='vol'){o.v=v;setFd(o.el,v);$('.db',o.el).textContent=fmt(v)}apply()}
function setFd(e,v){const t=$('.trk',e);if(t)t.style.setProperty('--v',v+'%')}
function fdSet(t,v){const o=getO(t.closest('[data-o]').dataset.o);o.v=v;setFd(o.el,v);$('.db',o.el).textContent=fmt(v);setKn(o.el,'vol',v);apply()}
let fdr=null,fdo=0;
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.trk');if(!t)return;ensure();e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(x){}fdr=t;const h=e.target.closest('.thm');if(h){const r=h.getBoundingClientRect();fdo=e.clientY-(r.top+r.height/2)}else{fdo=0;fdMove(e)}h&&h.focus()});
function fdMove(e){const r=fdr.getBoundingClientRect();let v=Math.max(0,Math.min(100,(r.bottom-(e.clientY-fdo))/r.height*100));if(Math.abs(v-UN)<1.5)v=UN;fdSet(fdr,Math.round(v*10)/10)}
document.addEventListener('pointermove',e=>{if(fdr)fdMove(e)});document.addEventListener('pointerup',()=>fdr=null);document.addEventListener('pointercancel',()=>fdr=null);
document.addEventListener('dblclick',e=>{const t=e.target.closest('.trk');if(t)fdSet(t,UN)});
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('.thm');if(!h||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const t=h.closest('.trk'),o=getO(t.closest('[data-o]').dataset.o);fdSet(t,Math.max(0,Math.min(100,o.v+(e.key==='ArrowUp'?1:-1)*(e.shiftKey?5:1))))});
let kd=null;
document.addEventListener('pointerdown',e=>{const k=e.target.closest('.kb');if(!k)return;ensure();e.preventDefault();try{k.setPointerCapture(e.pointerId)}catch(x){}kd={k,y:e.clientY,v:+k.dataset.v}});
document.addEventListener('pointermove',e=>{if(!kd)return;const k=kd.k,mn=+k.dataset.min,mx=+k.dataset.max;knSet(k,Math.max(mn,Math.min(mx,kd.v+(kd.y-e.clientY)/150*(mx-mn))),true)});
document.addEventListener('pointerup',()=>kd=null);document.addEventListener('pointercancel',()=>kd=null);
document.addEventListener('dblclick',e=>{const k=e.target.closest('.kb');if(k)knSet(k,+k.dataset.def,true)});
document.addEventListener('wheel',e=>{const k=e.target.closest('.kb');if(!k)return;e.preventDefault();const mn=+k.dataset.min,mx=+k.dataset.max;knSet(k,Math.max(mn,Math.min(mx,+k.dataset.v-Math.sign(e.deltaY)*(mx-mn)/40)),true)},{passive:false});
$('#vm').onclick=()=>{const k=document.body.classList.toggle('vk');$('#vm').textContent='Volume: '+(k?'Knob':'Fader')};
